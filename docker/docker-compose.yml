# Run from the repo root:  docker compose --env-file .env -f docker/docker-compose.yml up -d
name: fraud-ab-engine

x-app: &app
  build: { context: .., dockerfile: docker/Dockerfile }
  env_file: ../.env
  environment:
    KAFKA_BOOTSTRAP: kafka:9092
    CLICKHOUSE_HOST: clickhouse
  restart: unless-stopped

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment: { ZOOKEEPER_CLIENT_PORT: 2181, ZOOKEEPER_TICK_TIME: 2000 }
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: { zookeeper: { condition: service_healthy } }
    ports: ["127.0.0.1:29092:29092"]       # bound to localhost only
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["127.0.0.1:8123:8123"]         # HTTP interface, localhost only
    environment:
      CLICKHOUSE_DB: fraud
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1   # lets the admin user create roles/users via SQL
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ../config/clickhouse_config.xml:/etc/clickhouse-server/users.d/profiles.xml:ro
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      retries: 20

  topics-init:                              # creates topics from config/kafka_config.yaml, then exits
    <<: *app
    restart: "no"
    depends_on: { kafka: { condition: service_healthy } }
    command: ["python", "scripts/create_topics.py"]

  db-init:                                  # tables, masking view, roles, users; then exits
    <<: *app
    restart: "no"
    depends_on: { clickhouse: { condition: service_healthy } }
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_ADMIN_USER: ${CLICKHOUSE_ADMIN_USER}
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
    command: ["python", "scripts/init_db.py"]

  consumer:
    <<: *app
    profiles: ["app"]
    depends_on:
      topics-init: { condition: service_completed_successfully }
      db-init: { condition: service_completed_successfully }
    command: ["python", "-m", "pipeline.consumer_processor"]

  producer:                                 # run on demand: docker compose run --rm producer
    <<: *app
    profiles: ["producer"]
    restart: "no"
    volumes: ["../data:/app/data:ro"]
    command: ["python", "-m", "pipeline.producer", "--source", "data/sample_paysim.csv", "--rate", "2000"]

  dashboard:
    <<: *app
    profiles: ["app"]
    ports: ["127.0.0.1:8501:8501"]
    depends_on: { db-init: { condition: service_completed_successfully } }
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]

volumes:
  ch_data:
