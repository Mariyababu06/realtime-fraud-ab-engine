name: ci-cd
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q          # includes the SQL tests on embedded ClickHouse

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install pip-audit && pip-audit -r requirements.txt -r dashboard/requirements.txt
      - name: Fail if a .env or key file is tracked
        run: "! git ls-files | grep -E '(^|/)\\.env$|\\.pem$|\\.key$'"

  docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose --env-file .env.example -f docker/docker-compose.yml config -q
      - name: Build image
        run: docker build -f docker/Dockerfile -t fraud-ab-engine:ci .

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [security, docker]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
